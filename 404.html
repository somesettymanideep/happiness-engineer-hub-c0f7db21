<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Life Engineer</title>
    <script>
      // SPA fallback for GitHub Pages — preserve the path for BrowserRouter
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        "/?p=" + encodeURIComponent(l.pathname.slice(1)) +
        (l.search ? "&q=" + encodeURIComponent(l.search.slice(1)) : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
